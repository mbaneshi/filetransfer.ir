services:
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:18474
    ports:
      - "127.0.0.1:18473:3000"
    depends_on:
      - api

  api:
    build: ./apps/api
    environment:
      API_PORT: 8080
      APP_ENV: development
      DATABASE_URL: postgres://filetransfer:filetransfer@postgres:5432/filetransfer?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      MAX_FILE_SIZE_BYTES: 53687091200
      OBJECT_STORAGE_ENDPOINT: http://s3:7070
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:19000
      OBJECT_STORAGE_BUCKET: filetransfer
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
    ports:
      - "127.0.0.1:18474:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: filetransfer
      POSTGRES_USER: filetransfer
      POSTGRES_PASSWORD: filetransfer
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filetransfer -d filetransfer"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: ghcr.io/versity/versitygw:v1.9.0
    command: posix /data
    environment:
      ROOT_ACCESS_KEY: minioadmin
      ROOT_SECRET_KEY: minioadmin
    ports:
      - "127.0.0.1:19000:7070"
    volumes:
      - object_data:/data

volumes:
  postgres_data:
  object_data:

