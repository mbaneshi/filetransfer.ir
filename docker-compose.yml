services:
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:18474
    ports:
      - "127.0.0.1:18473:3000"
    depends_on:
      - api

  api:
    build: ./apps/api
    environment:
      API_PORT: 8080
      APP_ENV: development
      DATABASE_URL: postgres://filetransfer:filetransfer@postgres:5432/filetransfer?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      MAX_FILE_SIZE_BYTES: 53687091200
    ports:
      - "127.0.0.1:18474:8080"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: filetransfer
      POSTGRES_USER: filetransfer
      POSTGRES_PASSWORD: filetransfer
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:16379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - object_data:/data

volumes:
  postgres_data:
  object_data:

